services:
  # Backend API Web Service
  - type: web
    name: fintrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false # Set your Supabase PostgreSQL connection string in Render Dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: https://fintrack.vercel.app,http://localhost:3000
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # Set your Gemini API key in Render Dashboard
      - key: EMAIL_PROVIDER
        value: console
